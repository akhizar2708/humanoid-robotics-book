openapi: 3.0.3
info:
  title: Document Ingestion API
  description: |-
    API for ingesting book content (MDX files), generating embeddings, and storing in vector database.

    **Process Flow**:
    1. Parse MDX content → extract sections
    2. Chunk text (1024 tokens, 128 overlap)
    3. Generate embeddings via OpenAI API
    4. Store vectors in Qdrant + metadata in Postgres

    **Duplicate Detection**: Uses content hashing to avoid re-embedding unchanged content.
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/your-username/repo
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.your-domain.com
    description: Production server

tags:
  - name: ingestion
    description: Document ingestion operations

paths:
  /api/v1/ingest:
    post:
      tags:
        - ingestion
      summary: Ingest book content
      description: |-
        Ingest one or more MDX book files into the vector database.

        **Steps**:
        1. Parse MDX and extract text
        2. Chunk using RecursiveCharacterTextSplitter (1024 tokens, 128 overlap)
        3. Generate embeddings for each chunk (batched for efficiency)
        4. Store in Qdrant (vectors) + Postgres (metadata)
        5. Return ingestion statistics

        **Idempotency**: Uses content hashing. Re-ingesting unchanged content is a no-op.
      operationId: ingestContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
            examples:
              singleDocument:
                summary: Ingest single chapter
                value:
                  content_files:
                    - file_path: "docs/module-1/chapter-1.md"
                      content: "# ROS 2 Fundamentals\n\nROS 2 is a middleware framework..."
                      metadata:
                        module_id: "module-1"
                        chapter_id: "chapter-1"
                        section_title: "ROS 2 Fundamentals"
              multipleDocuments:
                summary: Ingest entire module (3 chapters)
                value:
                  content_files:
                    - file_path: "docs/module-1/chapter-1.md"
                      content: "# ROS 2 Fundamentals\n\n..."
                      metadata:
                        module_id: "module-1"
                        chapter_id: "chapter-1"
                        section_title: "ROS 2 Fundamentals"
                    - file_path: "docs/module-1/chapter-2.md"
                      content: "# Python AI Agents with ROS 2\n\n..."
                      metadata:
                        module_id: "module-1"
                        chapter_id: "chapter-2"
                        section_title: "Python AI Agents"
                    - file_path: "docs/module-1/chapter-3.md"
                      content: "# Humanoid Modeling with URDF\n\n..."
                      metadata:
                        module_id: "module-1"
                        chapter_id: "chapter-3"
                        section_title: "URDF Modeling"
      responses:
        '200':
          description: Ingestion completed (success or partial)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
              examples:
                fullSuccess:
                  summary: All documents ingested successfully
                  value:
                    chunks_created: 45
                    embeddings_generated: 45
                    skipped_unchanged: 0
                    status: "success"
                    processing_time_ms: 12450
                    errors: []
                partialSuccess:
                  summary: Some documents failed
                  value:
                    chunks_created: 30
                    embeddings_generated: 30
                    skipped_unchanged: 0
                    status: "partial"
                    processing_time_ms: 8200
                    errors:
                      - file_path: "docs/module-1/chapter-3.md"
                        error_code: "PARSING_ERROR"
                        message: "Invalid MDX syntax at line 42"
                noChanges:
                  summary: All content already ingested (unchanged)
                  value:
                    chunks_created: 0
                    embeddings_generated: 0
                    skipped_unchanged: 45
                    status: "success"
                    processing_time_ms: 150
                    errors: []
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyRequest:
                  summary: No content files provided
                  value:
                    error:
                      code: "INVALID_REQUEST"
                      message: "content_files array cannot be empty"
                      details:
                        field: "content_files"
                        constraint: "minItems:1"
                invalidMetadata:
                  summary: Missing required metadata
                  value:
                    error:
                      code: "INVALID_REQUEST"
                      message: "metadata.module_id is required"
                      details:
                        field: "content_files[0].metadata.module_id"
                        constraint: "required"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: "RATE_LIMIT_EXCEEDED"
                  message: "OpenAI embedding API rate limit exceeded. Please try again later."
                  details:
                    retry_after: 120
                    limit_type: "embeddings"
                    current_usage: "180 RPM"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                qdrantError:
                  summary: Vector database error
                  value:
                    error:
                      code: "DATABASE_ERROR"
                      message: "Failed to store vectors in Qdrant"
                      details:
                        service: "qdrant"
                        operation: "upsert"
                postgresError:
                  summary: Metadata storage error
                  value:
                    error:
                      code: "DATABASE_ERROR"
                      message: "Failed to store metadata in Postgres"
                      details:
                        service: "postgres"
                        operation: "insert"

  /api/v1/ingest/status:
    get:
      tags:
        - ingestion
      summary: Get ingestion statistics
      description: |-
        Retrieve statistics about ingested content:
        - Total chunks in database
        - Chunks per module
        - Last ingestion time
        - Storage usage
      operationId: getIngestionStatus
      responses:
        '200':
          description: Ingestion statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionStatus'
              example:
                total_chunks: 1250
                total_embeddings: 1250
                modules:
                  - module_id: "module-1"
                    chunk_count: 450
                    last_updated: "2025-12-16T10:30:00Z"
                  - module_id: "module-2"
                    chunk_count: 380
                    last_updated: "2025-12-15T14:20:00Z"
                  - module_id: "module-3"
                    chunk_count: 420
                    last_updated: "2025-12-14T09:15:00Z"
                storage_usage:
                  qdrant_mb: 8.5
                  postgres_mb: 12.3
                last_ingestion: "2025-12-16T10:30:00Z"

components:
  schemas:
    IngestRequest:
      type: object
      required:
        - content_files
      properties:
        content_files:
          type: array
          minItems: 1
          maxItems: 50
          description: Array of content files to ingest (max 50 per request)
          items:
            $ref: '#/components/schemas/ContentFile'

    ContentFile:
      type: object
      required:
        - file_path
        - content
        - metadata
      properties:
        file_path:
          type: string
          description: Relative path to the MDX file in docs/ directory
          example: "docs/module-1/chapter-1.md"
        content:
          type: string
          minLength: 100
          maxLength: 100000
          description: Full MDX file content (100-100,000 characters)
          example: "# ROS 2 Fundamentals\n\nROS 2 is a middleware framework..."
        metadata:
          $ref: '#/components/schemas/ContentMetadata'

    ContentMetadata:
      type: object
      required:
        - module_id
        - chapter_id
        - section_title
      properties:
        module_id:
          type: string
          pattern: '^module-[1-9]\d*$'
          description: Module identifier (e.g., 'module-1')
          example: "module-1"
        chapter_id:
          type: string
          pattern: '^chapter-[1-9]\d*$'
          description: Chapter identifier (e.g., 'chapter-1')
          example: "chapter-1"
        section_title:
          type: string
          minLength: 1
          maxLength: 255
          description: Section/chapter title
          example: "ROS 2 Fundamentals for Physical AI"
        page_url:
          type: string
          description: Docusaurus page URL (auto-generated if not provided)
          example: "/module-1/chapter-1"

    IngestResponse:
      type: object
      required:
        - chunks_created
        - embeddings_generated
        - skipped_unchanged
        - status
        - processing_time_ms
        - errors
      properties:
        chunks_created:
          type: integer
          minimum: 0
          description: Number of new chunks created and stored
          example: 45
        embeddings_generated:
          type: integer
          minimum: 0
          description: Number of embeddings generated via OpenAI API
          example: 45
        skipped_unchanged:
          type: integer
          minimum: 0
          description: Number of chunks skipped (content unchanged, hash match)
          example: 0
        status:
          type: string
          enum: [success, partial, failed]
          description: |-
            Ingestion status:
            - `success`: All files processed successfully
            - `partial`: Some files failed (see errors array)
            - `failed`: All files failed
          example: "success"
        processing_time_ms:
          type: integer
          minimum: 0
          description: Total processing time in milliseconds
          example: 12450
        errors:
          type: array
          description: Array of errors for files that failed to process
          items:
            $ref: '#/components/schemas/IngestError'

    IngestError:
      type: object
      required:
        - file_path
        - error_code
        - message
      properties:
        file_path:
          type: string
          description: Path to file that failed
          example: "docs/module-1/chapter-3.md"
        error_code:
          type: string
          enum:
            - PARSING_ERROR
            - EMBEDDING_ERROR
            - DATABASE_ERROR
            - CONTENT_TOO_LARGE
          description: Machine-readable error code
          example: "PARSING_ERROR"
        message:
          type: string
          description: Human-readable error message
          example: "Invalid MDX syntax at line 42: unclosed code block"
        details:
          type: object
          description: Additional error context
          additionalProperties: true
          example:
            line: 42
            column: 5

    IngestionStatus:
      type: object
      required:
        - total_chunks
        - total_embeddings
        - modules
        - storage_usage
        - last_ingestion
      properties:
        total_chunks:
          type: integer
          minimum: 0
          description: Total number of chunks in database
          example: 1250
        total_embeddings:
          type: integer
          minimum: 0
          description: Total number of embeddings (should equal total_chunks)
          example: 1250
        modules:
          type: array
          description: Per-module statistics
          items:
            type: object
            required:
              - module_id
              - chunk_count
              - last_updated
            properties:
              module_id:
                type: string
                example: "module-1"
              chunk_count:
                type: integer
                example: 450
              last_updated:
                type: string
                format: date-time
                example: "2025-12-16T10:30:00Z"
        storage_usage:
          type: object
          required:
            - qdrant_mb
            - postgres_mb
          properties:
            qdrant_mb:
              type: number
              format: float
              description: Qdrant storage usage in MB
              example: 8.5
            postgres_mb:
              type: number
              format: float
              description: Postgres storage usage in MB
              example: 12.3
        last_ingestion:
          type: string
          format: date-time
          description: Timestamp of most recent ingestion
          example: "2025-12-16T10:30:00Z"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - INVALID_REQUEST
                - RATE_LIMIT_EXCEEDED
                - DATABASE_ERROR
                - PARSING_ERROR
              example: "INVALID_REQUEST"
            message:
              type: string
              description: Human-readable error message
              example: "content_files array cannot be empty"
            details:
              type: object
              description: Additional error context
              additionalProperties: true
              example:
                field: "content_files"
                constraint: "minItems:1"
